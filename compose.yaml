services:
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://selecta:${POSTGRES_PASSWORD}@db:5432/selecta
      SELECTA_HOST: 0.0.0.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - data:/data
      - ./examples:/examples:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: selecta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: selecta
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "selecta"]
      interval: 2s
      retries: 15

volumes:
  db:
  data:
