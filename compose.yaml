services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: selecta
      POSTGRES_PASSWORD: selecta
      POSTGRES_DB: selecta
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "selecta"]
      interval: 2s
      retries: 15

volumes:
  db:
