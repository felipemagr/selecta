<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Selecta</title>
<style>
  :root { --bg: #111; --fg: #eee; --dim: #888; --accent: #e8a33d; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; height: 100dvh; display: flex; flex-direction: column; background: var(--bg);
         color: var(--fg); font: 17px/1.4 system-ui, sans-serif; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .you { align-self: flex-end; color: var(--dim); text-align: right; max-width: 85%; }
  .selecta { align-self: flex-start; max-width: 85%; }
  .problem { align-self: center; color: var(--accent); font-size: 15px; }
  #bar { padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); display: flex;
         flex-direction: column; align-items: center; gap: 8px; }
  #talk { width: 132px; height: 132px; border-radius: 50%; border: 0; background: #2a2a2a;
          color: var(--fg); font: 600 16px system-ui; touch-action: none; user-select: none; }
  #talk.held { background: var(--accent); color: #111; }
  #status { color: var(--dim); font-size: 14px; min-height: 1.4em; }
</style>
</head>
<body>
<div id="log"></div>
<div id="bar">
  <button id="talk">Hold to talk</button>
  <div id="status">Press and hold, speak, release.</div>
</div>
<script>
const MIC_RATE = 16000, SPEECH_RATE = 24000, CHUNK_MS = 100;
const log = document.getElementById("log"), button = document.getElementById("talk"),
      status = document.getElementById("status");
let ws, ctx, mic, worklet, held = false, busy = false;
let lines = [], nextStart = 0, reply = null, pending = [];
// After a press, messages from the previous turn may still arrive: drop them until "started".
let current = true;

function note(cls, text) {
  const el = document.createElement("div"); el.className = cls; el.textContent = text;
  log.appendChild(el); log.scrollTop = log.scrollHeight; return el;
}

function connect() {
  return new Promise((resolve, reject) => {
    if (ws && ws.readyState === WebSocket.OPEN) return resolve();
    ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/talk`);
    ws.binaryType = "arraybuffer";
    ws.onopen = () => resolve();
    ws.onerror = () => reject(new Error("can't reach the server"));
    ws.onclose = () => { status.textContent = "Disconnected. Press to reconnect."; busy = false; };
    ws.onmessage = onMessage;
  });
}

function onMessage(message) {
  if (!(message.data instanceof ArrayBuffer) && JSON.parse(message.data).type === "started") {
    current = true; return;
  }
  if (!current) return;
  if (message.data instanceof ArrayBuffer) return play(new Float32Array(message.data));
  const event = JSON.parse(message.data);
  if (event.type === "transcript") {
    note("you", event.text || "(nothing heard)");
    status.textContent = "Thinking...";
  } else if (event.type === "line") {
    lines.push({ end: null });
    reply = reply || note("selecta", "");
    reply.textContent += (reply.textContent ? " " : "") + event.text;
    status.textContent = "Speaking. Press to interrupt.";
  } else if (event.type === "problem") {
    note("problem", event.text);
  } else if (event.type === "done") {
    busy = false; reply = null;
    if (!playing()) status.textContent = "Press and hold, speak, release.";
  }
}

function play(samples) {
  const buffer = ctx.createBuffer(1, samples.length, SPEECH_RATE);
  buffer.copyToChannel(samples, 0);
  const source = ctx.createBufferSource();
  source.buffer = buffer; source.connect(ctx.destination);
  const start = Math.max(nextStart, ctx.currentTime);
  source.start(start);
  nextStart = start + buffer.duration;
  // A line counts as heard once all of its audio so far has played.
  if (lines.length) lines[lines.length - 1].end = nextStart;
  (play.sources = play.sources || []).push(source);
}

function playing() { return ctx && nextStart > ctx.currentTime; }

function stopPlayback() {
  (play.sources || []).forEach(s => { try { s.stop(); } catch (_) {} });
  play.sources = []; nextStart = 0;
}

async function startMic() {
  if (!mic) {
    mic = await navigator.mediaDevices.getUserMedia(
      { audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 } });
    const code = `class Tap extends AudioWorkletProcessor {
      process(inputs) { if (inputs[0][0]) this.port.postMessage(inputs[0][0].slice()); return true; }
    } registerProcessor("tap", Tap);`;
    await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([code], { type: "text/javascript" })));
    worklet = new AudioWorkletNode(ctx, "tap");
    ctx.createMediaStreamSource(mic).connect(worklet);
  }
  const ratio = ctx.sampleRate / MIC_RATE, perChunk = MIC_RATE * CHUNK_MS / 1000;
  let position = 0;
  pending = [];
  worklet.port.onmessage = ({ data }) => {
    if (!held) return;
    for (; position < data.length; position += ratio) pending.push(data[Math.floor(position)]);
    position -= data.length;
    while (pending.length >= perChunk) sendPcm(pending.splice(0, perChunk));
  };
}

function sendPcm(samples) {
  ws.send(new Int16Array(samples.map(x => Math.max(-1, Math.min(1, x)) * 32767)).buffer);
}

async function press(event) {
  event.preventDefault();
  if (held) return;
  held = true; button.classList.add("held"); status.textContent = "Listening...";
  try {
    ctx = ctx || new AudioContext();
    await ctx.resume();
    await connect();
    if (!held) return;  // released while connecting: a tap, not an utterance
    const cutOff = busy || playing();
    const heard = lines.filter(l => l.end !== null && l.end <= ctx.currentTime).length;
    stopPlayback(); lines = []; reply = null; current = false;
    ws.send(JSON.stringify({ type: "start", heard_lines: cutOff ? heard : null }));
    busy = true;
    await startMic();
  } catch (e) {
    held = false; button.classList.remove("held"); status.textContent = e.message;
  }
}

function release(event) {
  event.preventDefault();
  if (!held) return;
  held = false; button.classList.remove("held");
  if (ws && ws.readyState === WebSocket.OPEN) {
    if (pending.length) sendPcm(pending.splice(0));
    ws.send(JSON.stringify({ type: "stop" }));
  }
  status.textContent = "Transcribing...";
}

button.addEventListener("pointerdown", press);
button.addEventListener("pointerup", release);
button.addEventListener("pointercancel", release);
button.addEventListener("contextmenu", e => e.preventDefault());
</script>
</body>
</html>
