<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Selecta</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<style>
  @font-face { font-family: "Geist Mono"; font-weight: 100 900; font-display: block;
               src: url(/static/fonts/geist-mono.woff2) format("woff2"); }
  :root { --black: #000; --white: #fff; --grey: rgb(255 255 255 / 0.56); --red: #d71921;
          --ease-out: cubic-bezier(0.23, 1, 0.32, 1); --size: min(80vw, 50vh); }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { display: grid; place-items: center; background: var(--black); color: var(--white);
         font: 400 12px/1.4 "Geist Mono", monospace; letter-spacing: 0.16em; text-transform: uppercase;
         -webkit-font-smoothing: antialiased;
         user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
  #talk { width: var(--size); height: var(--size); padding: 0; border: 0; border-radius: 50%;
          background: none; cursor: pointer; outline: none; transition: transform 160ms var(--ease-out); }
  #talk:active, #talk.held { transform: scale(0.96); }
  #talk:focus-visible { outline: 1px solid var(--grey); outline-offset: 12px; }
  #glyph { display: block; width: 100%; height: 100%; }
  #name { position: fixed; top: calc(24px + env(safe-area-inset-top)); left: 24px; color: var(--grey); }
  #state { position: fixed; top: calc(24px + env(safe-area-inset-top)); right: 24px; color: var(--grey);
           display: flex; align-items: center; gap: 8px; }
  #state.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--red); }
  #hint { position: fixed; left: 24px; right: 24px; bottom: calc(40px + env(safe-area-inset-bottom));
          text-align: center; color: var(--grey); text-transform: none; letter-spacing: 0.02em; font-size: 13px; }
  #hint:empty { display: none; }
</style>
</head>
<body>
<div id="name">Selecta</div>
<div id="state">Hold to talk</div>
<button id="talk" aria-label="Hold to talk"><canvas id="glyph"></canvas></button>
<p id="hint"></p>
<script type="module">
import { Glyph } from "/static/glyph.js";
const MIC_RATE = 16000, CHUNK_MS = 100;
const button = document.getElementById("talk"), hint = document.getElementById("hint"),
      state = document.getElementById("state"), glyph = new Glyph(document.getElementById("glyph"), { dots: 21, base: 0.22 });
let ws, ctx, mic, worklet, held = false, accepted = false, pending = [], screenOn = true, permission = "prompt", fade;

const LABELS = { idle: "Hold to talk", listening: "Listening", thinking: "Thinking" };
function mode(name) {
  glyph.set(name); state.textContent = LABELS[name]; state.classList.toggle("live", name === "listening");
}

function say(text, seconds) {
  clearTimeout(fade); hint.textContent = text;
  if (seconds) fade = setTimeout(() => { hint.textContent = screenOn ? "" : "Open Selecta on the TV"; }, seconds * 1000);
}

function connect() {
  return new Promise((resolve, reject) => {
    if (ws && ws.readyState === WebSocket.OPEN) return resolve();
    ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/talk`);
    ws.onopen = () => resolve();
    ws.onerror = () => reject(new Error("Can't reach Selecta"));
    ws.onclose = () => mode("idle");
    ws.onmessage = ({ data }) => on(JSON.parse(data));
  });
}

function on(event) {
  if (event.type === "started") {
    accepted = held;
  } else if (event.type === "screen") {
    screenOn = event.on;
    if (!hint.textContent || hint.textContent === "Open Selecta on the TV") say(screenOn ? "" : "Open Selecta on the TV");
  } else if (event.type === "transcript" || event.type === "line") {
    mode("thinking");
  } else if (event.type === "done") {
    mode("idle");
  } else if (event.type === "problem") {
    mode("idle"); say(event.text, 4);
  }
}

async function openMic() {
  mic = await navigator.mediaDevices.getUserMedia(
    { audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 } });
  ctx = ctx || new AudioContext();
  const code = `class Tap extends AudioWorkletProcessor {
    process(inputs) { if (inputs[0][0]) this.port.postMessage(inputs[0][0].slice()); return true; }
  } registerProcessor("tap", Tap);`;
  await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([code], { type: "text/javascript" })));
  worklet = new AudioWorkletNode(ctx, "tap");
  ctx.createMediaStreamSource(mic).connect(worklet);
  worklet.port.onmessage = ({ data }) => listen(data);
}

let position = 0;
function listen(data) {
  if (!held) return;
  const ratio = ctx.sampleRate / MIC_RATE, perChunk = MIC_RATE * CHUNK_MS / 1000;
  let peak = 0;
  for (; position < data.length; position += ratio) {
    const x = data[Math.floor(position)];
    pending.push(x); peak = Math.max(peak, Math.abs(x));
  }
  position -= data.length;
  glyph.level(Math.min(1, peak * 3));
  while (pending.length >= perChunk) sendPcm(pending.splice(0, perChunk));
}

function sendPcm(samples) {
  ws.send(new Int16Array(samples.map(x => Math.max(-1, Math.min(1, x)) * 32767)).buffer);
}

async function press(event) {
  event.preventDefault();
  if (held) return;
  if (!navigator.mediaDevices) return say("Open Selecta over HTTPS to use the microphone");
  // The first press only asks for the microphone; talking starts on the next one.
  if (!mic && permission !== "granted") {
    try { await openMic(); permission = "granted"; navigator.vibrate?.(10); say("Ready. Hold to talk", 3); }
    catch (_) { say("The microphone is blocked. Allow it in the browser's site settings."); }
    return;
  }
  held = true; button.classList.add("held"); mode("listening"); navigator.vibrate?.(12);
  try {
    if (!mic) await openMic();
    await ctx.resume();
    await connect();
    if (!held) return;  // released while connecting: a tap, not an utterance
    pending = []; position = 0; accepted = false;
    ws.send(JSON.stringify({ type: "start" }));
  } catch (e) {
    held = false; button.classList.remove("held"); mode("idle"); say(e.message || "Something went wrong", 4);
  }
}

function release(event) {
  event.preventDefault();
  if (!held) return;
  held = false; button.classList.remove("held"); glyph.level(0);
  if (ws && ws.readyState === WebSocket.OPEN) {
    if (pending.length) sendPcm(pending.splice(0));
    ws.send(JSON.stringify({ type: "stop" }));
    // Only a press the server took gets an answer to wait for.
    mode(accepted ? "thinking" : "idle");
  }
}

button.addEventListener("pointerdown", press);
button.addEventListener("pointerup", release);
button.addEventListener("pointercancel", release);
addEventListener("contextmenu", e => e.preventDefault());
addEventListener("selectstart", e => e.preventDefault());

navigator.permissions?.query({ name: "microphone" }).then(status => {
  permission = status.state;
  if (permission === "prompt") say("Tap to allow the microphone");
  if (permission === "denied") say("The microphone is blocked. Allow it in the browser's site settings.");
}).catch(() => {});
connect().catch(e => say(e.message));
</script>
</body>
</html>
